# Index of penetration analog series. Series data lives in series/<id>.csv as `year,penetration`
# rows with penetration a decimal in [0,1]. This file holds metadata only; fitted parameters are
# always derived fresh by penetration_fit.py, never cached here. See ../penetration.md for the
# measure definitions, quality rules, and the contract for adding analogs.
#
# Fields per analog:
#   id               matches series/<id>.csv
#   measure          stock | new-sales-share | spend-share (see penetration.md)
#   base             the addressable base the penetration fraction is measured against
#   categories       tags used for analog selection
#   ceiling-estimate saturation ceiling L used when fitting this analog (judgment; revisit as data accrues)
#   quality          seed-approximate | verified
#   sources          where the numbers come from / where to verify them

analogs:
  - id: us-smartphones
    name: US smartphone adoption
    region: US
    measure: stock
    base: US adults owning a smartphone
    categories: [consumer-hardware, mobile, fast-diffusion]
    ceiling-estimate: 0.93
    quality: verified
    sources:
      - "Pew Research Center, Mobile Fact Sheet, % of US adults who own a smartphone (pewresearch.org/internet/fact-sheet/mobile): 2011 35, 2015 68, 2018 77, 2019 81, 2021 85, 2023 90, 2024 91."
    notes: Fast consumer-hardware diffusion riding an existing subsidy/carrier channel. Series is the Pew adult smartphone-ownership trend, 2011-2024; plateauing ~0.91.

  - id: us-internet-adults
    name: US internet adoption
    region: US
    measure: stock
    base: US adults using the internet
    categories: [consumer-technology, connectivity, fast-diffusion]
    ceiling-estimate: 0.97
    quality: verified
    sources:
      - "Pew Research Center, Internet/Broadband Fact Sheet, % of US adults who use the internet (pewresearch.org/internet/fact-sheet/internet-broadband): 2000 52, 2005 68, 2010 76, 2015 86, 2019 90, 2021 93, 2023 95, 2024 96. 1995 (14) from Pew's early tracking."
    notes: Adoption required new spend and some skill; slower than smartphones, faster than appliances. Ceiling raised to 0.97 to sit above the ~0.96 recent observed level.

  - id: us-social-media
    name: US social media adoption
    region: US
    measure: stock
    base: US adults using at least one social media site
    categories: [consumer-software, network-effects, fast-diffusion]
    ceiling-estimate: 0.74
    quality: seed-approximate
    sources:
      - "Pew Research Center, Social Media Fact Sheet (pewresearch.org/internet/fact-sheet/social-media). Endpoints confirmed: 50% of US adults by 2011, ~72% by 2021."
    notes: >
      Free product with network effects; note the visibly lower ceiling than internet access itself.
      LEFT seed-approximate: the 2011 (0.50) and 2021 (0.72) endpoints were confirmed against Pew, but
      the intermediate points were not individually re-verified, and Pew changed survey mode in 2023
      (phone -> web/mail), breaking strict comparability. Pew's own aggregate and the OWID mirror
      diverge by several points on some mid-decade years, so treat the curve shape as approximate.

  - id: us-color-tv
    name: US color TV household adoption
    region: US
    measure: stock
    base: US households owning a color TV
    categories: [consumer-hardware, replacement-upgrade, medium-diffusion]
    ceiling-estimate: 0.97
    quality: verified
    sources:
      - "Our World in Data, Technology Adoption in US Households, underlying Comin & Hobijn CHAT dataset (ourworldindata.org/grapher/technology-adoption-by-households-in-the-united-states, entity 'Colour TV')"
    notes: >
      Upgrade of an existing behavior; gated early by price declines and content availability.
      Series is the CHAT annual color-TV household share, 1966-1990; it plateaus ~96-97% by the
      mid-2000s, so the ceiling sits just above the observed max (0.96).

  - id: us-dishwashers
    name: US dishwasher household adoption
    region: US
    measure: stock
    base: US households with a dishwasher
    categories: [consumer-appliance, home-installation, slow-diffusion]
    ceiling-estimate: 0.74
    quality: verified
    sources:
      - "Our World in Data, Technology Adoption in US Households, underlying Comin & Hobijn CHAT dataset (ourworldindata.org/grapher/technology-adoption-by-households-in-the-united-states, entity 'Dishwasher'); early years from Greenwood et al. (2005), 1992+ from US Census Bureau"
    notes: >
      Slow-diffusion anchor: install friction, weak perceived benefit for many households, and a
      sub-1.0 ceiling even after 60+ years. Include when priors feel too optimistic. Series is the
      CHAT "dishwasher present in household" share (1960-2010); it was still creeping up ~0.69-0.70
      at series end, so the ceiling (0.74) is a near-plateau judgment and genuinely uncertain. The
      alternative EIA RECS "household uses a dishwasher" measure runs a few points lower (~0.68 by
      2020) but tells the same slow-diffusion story.

  - id: us-ev-new-sales
    name: US EV share of new light-vehicle sales
    region: US
    measure: new-sales-share
    base: new US light-vehicle sales that are plug-in (BEV + PHEV)
    categories: [automotive, energy-transition, capital-goods, early-curve]
    ceiling-estimate: 0.90
    quality: verified
    sources:
      - "IEA Global EV Outlook (electric-car share of new car sales, BEV+PHEV), via Our World in Data (ourworldindata.org/grapher/electric-car-sales-share, entity United States): 2018 2.3, 2021 4.7, 2022 7.7, 2023 9.7, 2024 10, 2025 ~10."
    notes: >
      Flow proxy, not installed base; usable because new-sales share is itself an S-curve for
      replacement-cycle goods. Still pre-inflection, so its own fit is unstable — more useful as a
      target example than as a prior. Ceiling is a long-run judgment, highly uncertain. Series shows
      real year-to-year dips (2015, 2019) and a 2024-2025 plateau near 0.10 as US EV growth slowed;
      the load-time non-monotonic warning is expected for a flow measure.

  - id: us-ecommerce-retail-share
    name: US e-commerce share of retail sales
    region: US
    measure: spend-share
    base: US retail sales (excl. some categories per Census definition) transacted online
    categories: [retail, consumer-software, spend-migration, slow-diffusion]
    ceiling-estimate: 0.35
    quality: verified
    sources:
      - "US Census Bureau, Quarterly Retail E-Commerce Report, e-commerce as % of total retail sales, annual figures (census.gov/retail/ecommerce.html): 2000 0.9, 2012 5.2, 2019 11.0, 2020 13.6, 2021 13.2, 2022 14.7, 2023 15.5, 2024 16.2; Q1-2026 ran 16.9%. Values are Census-published and subject to periodic revision."
    notes: >
      Spend share, not unit adoption — an analog for share-of-activity migration rather than device
      ownership. Includes the 2020 COVID spike and the small 2021 reversion (13.6 -> 13.2, a genuine
      non-monotonic dip as physical retail reopened; the load-time warning is expected). Low,
      uncertain ceiling.

  - id: uk-online-retail-share
    name: UK online share of retail sales
    region: UK
    measure: spend-share
    base: Great Britain retail sales excluding automotive fuel transacted online
    categories: [retail, consumer-software, spend-migration, slow-diffusion, pandemic-shock]
    ceiling-estimate: 0.45
    quality: seed-approximate
    sources:
      - "UK Office for National Statistics, Retail Sales Index internet sales tables, annual average percentage of retail sales conducted online (ons.gov.uk/businessindustryandtrade/retailindustry)."
    notes: >
      Like-for-like spend-share analog with a documented COVID step-up and partial reopening
      reversal. Annual values are rounded transcriptions of ONS monthly/annual internet-sales
      releases through 2025 and should be rechecked against the downloadable ONS series before
      upgrading to verified. The 0.45 ceiling is a judgment above the post-pandemic plateau.

  # --- Era-matched analogs: late-20th / early-21st century consumer electronics that had fully
  # matured by ~2005-2010. These are the right priors when back-testing a ~2008-2013 base-year
  # subject, because their adoption-speed era is one generation back from the subject (as it is in
  # live use today), not mid-century. See ../penetration.md and the back-test reference.

  - id: us-dvd-player
    name: US DVD player household adoption
    region: US
    measure: stock
    base: US households owning a DVD player
    categories: [consumer-electronics, media-hardware, replacement-upgrade, fast-diffusion, era-2000s]
    ceiling-estimate: 0.92
    quality: verified
    sources:
      - "Digital Entertainment Group (DEG) / Consumer Electronics Association quarterly DVD household reports, as reported in Home Media Magazine and Media Play News. Anchors: ~5% end-1999; 50M households with >=1 player Dec-2003 (~0.46 of US households); ~three-quarters of households by end-2005; ~90% plateau by 2010."
    notes: >
      Fastest historical consumer-hardware diffusion pre-smartphone (~0 to plateau in ~8 years),
      riding the installed TV base and cheap hardware. The best fast era-matched prior for
      late-2000s subjects. Penetration is household ownership of >=1 DVD player (DEG household counts
      over US households). The 2000-2002 and 2004 mid-curve points are interpolated between reported
      DEG milestones and are approximate; the 1999, 2003 and end-2005 anchors are sourced. Prior
      transcription overstated 2002-2005 by ~5-7pts.

  - id: us-vcr
    name: US VCR household adoption
    region: US
    measure: stock
    base: US households owning a VCR
    categories: [consumer-electronics, media-hardware, replacement-upgrade, medium-diffusion, era-1990s]
    ceiling-estimate: 0.94
    quality: verified
    sources:
      - "Pre-1992 growth from the Electronic Industries Association / CEA household VCR-penetration series (the standard diffusion table, reproduced in the US Statistical Abstract; corroborating anchors: ~50% in 1987, ~62-65% in 1988-1989). 1992-2005 plateau from US Census / Comin & Hobijn CHAT (ourworldindata.org grapher 'Videocassette recorder': 1992 73.8, 1998 85.2, 2003 90.0, 2005 92.2)."
    notes: >
      Prior generation of the DVD story; medium-speed hardware diffusion that matured ~90%+ by the
      early 2000s. The pre-1992 points follow the standard EIA/CEA series; secondary reports vary by
      a few points around 1985-1986 (some put end-1985/1986 nearer 35%), so treat the early growth
      shape as approximate-to-a-few-points while the 1992+ plateau is directly sourced. Ceiling 0.94
      sits just above the 0.922 observed max.

  - id: us-cable-tv
    name: US cable TV household adoption
    region: US
    measure: stock
    base: US households subscribing to cable television
    categories: [subscription, media-distribution, home-installation, medium-diffusion, era-1990s]
    ceiling-estimate: 0.71
    quality: verified
    sources:
      - "Penetration = NCTA/FCC basic-cable subscriber counts divided by Nielsen TV-household universe (TVB National TV Household Penetration Trends, tvb.org). Subscriber anchors: 1980 16.0M, 1990 51.7M, 2000 68.5M (peak), 2005 65.4M, 2010 ~60M (NCTA/FCC Video Competition Reports)."
    notes: >
      Subscription (recurring-fee) diffusion with a distinctly sub-1.0 ceiling and a later decline —
      a useful moderate-ceiling, install-gated analog. The stored series is deliberately truncated at
      the ~2001 plateau (~0.68 of TV households) so it remains a clean monotonic diffusion; do not
      extend it through the cord-cutting era. For the record, basic-cable penetration then fell to
      ~0.60 by 2005 and ~0.52 by 2010 as satellite/telco/OTT took share (that decline is why the
      logistic prior must stop at the peak). Note this is CABLE specifically, not all multichannel/
      pay-TV (which stayed ~0.80+ through the 2000s). The 1985 (0.44) point is derived from an
      interpolated subscriber count and is approximate; the other growth-phase points cross-check to
      within ~1pt of subscriber-over-TV-household ratios. Do NOT confuse with the CHAT "Cable TV"
      series, which runs much higher (~0.35 in 1980) because it measures homes passed / availability,
      not subscription.

  - id: us-home-computer
    name: US home computer household adoption
    region: US
    measure: stock
    base: US households owning a personal computer
    categories: [consumer-hardware, general-purpose, slow-diffusion, era-1990s]
    ceiling-estimate: 0.82
    quality: verified
    sources:
      - "US Census Current Population Survey, Computer and Internet Use supplements, via Our World in Data / Comin & Hobijn CHAT (ourworldindata.org/grapher/technology-adoption-by-households-in-the-united-states, entity 'Microcomputer')"
    notes: >
      Slower, expensive general-purpose hardware; long climb from the mid-1980s. A moderate-speed
      era-matched anchor between the fast DVD curve and the mid-century appliances. Series tracks
      dedicated household PC (microcomputer) ownership, which plateaued ~0.77 around 2010-2013 -
      hence the 0.82 ceiling. The broader Census ACS "any computer" definition (which counts
      smartphones and tablets from ~2013) climbs to ~0.89 and is deliberately NOT used here, as it
      conflates devices rather than measuring PC diffusion.

  # --- Modern network-effect / subscription analog: paid streaming (SVOD). A recent, fast
  # subscription-diffusion prior for live work — rides the existing broadband channel with near-zero
  # install friction, so it is faster than the era-2000s hardware analogs.

  - id: us-streaming-svod
    name: US paid streaming (SVOD) household adoption
    region: US
    measure: stock
    base: US households subscribing to at least one of the top SVOD services (Netflix, Amazon Prime Video, and/or Hulu)
    categories: [subscription, network-effects, media-distribution, fast-diffusion, era-2010s]
    ceiling-estimate: 0.90
    quality: verified
    sources:
      - "Leichtman Research Group annual studies, % of US households with a top SVOD service (Netflix/Amazon Prime Video/Hulu): 2015 52, 2017 64, 2018 69, 2019 74, 2020 78, 2021 78, 2022 82, 2023 83 (leichtmanresearch.com; reported in Media Play News, TV Tech, Next TV). Corroborated by Nielsen and MPA THEME reports."
    notes: >
      Recent, fast subscription diffusion with strong network/catalog effects and near-zero install
      friction (rides the existing broadband channel), making it a good era-2010s prior for modern
      subscription markets. Measure is the consistent Leichtman "top-3 SVOD" household penetration;
      it slightly UNDERSTATES "any paid SVOD," which reached ~0.88 by 2022-2023, so the ceiling (0.90)
      allows for the broader any-SVOD saturation. The 2013 (0.44) and 2014 (0.47) points are estimates
      of the early takeoff (Leichtman's consistent top-3 series begins ~2015 at 0.52) and should be
      treated as approximate; 2015-2023 are sourced. Overlaps a back-test subject under separate
      development, but is retained here as a live-use prior.
