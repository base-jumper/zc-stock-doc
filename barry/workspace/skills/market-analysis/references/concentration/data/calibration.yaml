      broadly financeable capital; franchising shifts much of it to operators. Purchasing, advertising
      and systems offer moderate economies that flatten well below national scale. Health, zoning and
      liquor rules are local hurdles, not a general numerical cap. Shares verified/cited; traits checked
      against durable mechanism evidence without using realized shares.

