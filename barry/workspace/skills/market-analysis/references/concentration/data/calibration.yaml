      production ramp, making capital and learning-curve economies exceptionally strong. Type and
      production certification are hard, durable legal gates. Fleet commonality, pilot/maintenance
      training, spares and infrastructure impose material switching costs; installed-fleet support has
      a bounded complement effect. Safety and dispatch-reliability reputation strongly affect purchase.
      Flight data does not make the airframe inherently better at scale. Shares verified/cited; traits
      checked against durable mechanism evidence without using realized shares. The two-point split is
      poorly geometric by construction.

  - id: us-card-payment-networks
    name: US card payment networks
    region: US
    share-basis: purchase-volume
    matured-year: 2023
    categories: [payments, network-effects, two-sided, oligopoly]
    traits:
      network-effects:      {score: 0.75, confidence: 0.95}
      switching-costs:      {score: 0.40, confidence: 0.85}
      data-scale-advantage: {score: 0.35, confidence: 0.75}
      brand-reputation:     {score: 0.70, confidence: 0.90}
      capital-intensity:    {score: 0.55, confidence: 0.85}
      scale-economies:      {score: 0.80, confidence: 0.90}
      regulatory-barriers:  {score: 0.45, confidence: 0.85}
    quality: verified
    sources:
      - "The Nilson Report figures compiled by The Motley Fool, 2023 US credit-card purchase-volume share by network (Visa 52%, Mastercard 24%, American Express 19%, Discover 5%): https://www.fool.com/money/research/credit-debit-card-market-share-network-issuer/"
      - "US DOJ, Competitive Impact Statement, United States v. Visa and Plaid, 2020 (two-sided network effects and high entry barriers in online debit): https://www.justice.gov/atr/case-document/file/1334726/dl"
      - "Federal Reserve, Regulation II final rule on debit-card routing, 2022 (at least two unaffiliated networks and routing choice, weakening exclusivity): https://www.federalreserve.gov/newsevents/pressreleases/bcreg20221003a.htm"
      - "Visa 2023 Form 10-K (global processing infrastructure, acceptance, security/fraud services, brand and regulation): https://www.sec.gov/Archives/edgar/data/1403161/000140316123000099/v-20230930.htm"
    notes: >
      Merchant acceptance attracts cardholders and cardholders attract merchants, a strong two-sided
      effect weakened by widespread multi-homing and routing rules. Issuers, acquirers and merchants
      incur integration and certification costs, but consumers can carry several cards. Transaction
      data improves fraud/risk services, though diminishing returns and shared inputs hold the data
      score down. Trust and acceptance marks matter. Resilient global processing has meaningful capital
      and strong fixed-cost scale. Regulation raises compliance and sometimes mandates competition
      rather than capping entry. Shares verified/cited; traits checked against mechanism evidence
      without using realized shares. The flat top is poorly geometric.

