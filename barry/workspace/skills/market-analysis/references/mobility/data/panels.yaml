  - id: us-bank-deposits
    name: US bank deposits
    market: >
      Domestic deposits at all FDIC-insured institutions headquartered in US states and
      territories, ranked by institution; a share is the institution's DEPDOM divided by DEPDOM
      summed over the same year-end FDIC Financials reporting universe.
    region: United States and territories
    basis: deposits
    coverage: 10
    tracker: "FDIC BankFind Suite Financials API"
    tracker-notes: >
      Each observation uses REPDTE=YYYY1231 and ranks the API's institution records by unrounded
      DEPDOM. The denominator is the same query universe's sum(DEPDOM), including institutions
      headquartered in states and territories. Legal-name changes are mapped to stable company
      lineages so they do not create false exits.
    quality: verified
    penetration:
      logistic: {t0: 1950.0, k: 0.12}
      provenance: estimated
    players:
      "Bank of America, National Association": {founded: 1904}
      "JPMorgan Chase Bank, National Association": {founded: 1799, notes: "Canonical lineage for CERT 628, reported historically as Chemical Bank and Chase Manhattan before JPMorgan Chase."}
