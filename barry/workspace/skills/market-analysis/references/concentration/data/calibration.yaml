    notes: >
      Hub breadth, schedule frequency and frequent-flyer partnerships create bounded network and
      loyalty effects, but comparison shopping and route-level choice limit lock-in. Safety/service
      reputation tilts choice without overriding fare and schedule. Aircraft and airport facilities
      make the entry ticket heavy; fleet, network and overhead fixed costs give moderate economies
      that can be reached below national-leader scale. FAA certification and scarce slots at a few
      airports are real gates, while economic entry is otherwise open. Operational data does not
      create a demand-side quality loop. Shares verified/cited; traits checked against mechanism
      evidence without using realized shares. The flat top is poorly geometric by construction.

  - id: global-mobile-os
    name: Global mobile operating systems
    region: Global
    share-basis: device-usage
    matured-year: 2023
    categories: [consumer-tech, platform, network-effects, switching-costs, duopoly]
    traits:
      network-effects:      {score: 0.75, confidence: 0.90}
      switching-costs:      {score: 0.75, confidence: 0.90}
      data-scale-advantage: {score: 0.20, confidence: 0.70}
      brand-reputation:     {score: 0.60, confidence: 0.85}
      capital-intensity:    {score: 0.55, confidence: 0.85}
      scale-economies:      {score: 0.80, confidence: 0.90}
      regulatory-barriers:  {score: 0.15, confidence: 0.90}
    quality: verified
    sources:
      - "StatCounter Global Stats, worldwide mobile operating-system share, monthly Jan-Dec 2023; 2023 annual means computed from the downloadable CSV (Android 70.4%, iOS 29.0%, Samsung 0.4%): https://gs.statcounter.com/os-market-share/mobile/worldwide/2023"
      - "UK CMA, Mobile ecosystems market study final report, 2022 (app-developer/user indirect network effects; data, app, purchase and accessory switching frictions; multi-homing constraints): https://assets.publishing.service.gov.uk/media/62a229c28fa8f50395c0a8e1/mobile-ecosystems-market-study-final-report.pdf"
      - "Android Open Source Project, Compatibility program overview (open source availability; compatibility enables a common app ecosystem): https://source.android.com/docs/compatibility/overview"
    notes: >
      App users attract developers and app availability attracts users, a strong indirect effect
      bounded by developer multi-homing. Apps, purchases, learned workflows, cloud data and accessories
      make ecosystem switching costly. OS usage data is not shown to create a non-replicable product-
      quality loop, so data advantage is held low. Device/platform trust matters. OS engineering and
      developer tooling have high fixed costs and global reuse, though Android source lowers the pure
      capital ticket; no licence caps OS entry. Shares verified/cited; traits checked against mechanism
      evidence without using realized shares. The hard-duopoly top is poorly geometric.

