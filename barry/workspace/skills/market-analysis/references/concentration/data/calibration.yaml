    categories: [transport, commodity, fragmented, weak-moat]
    traits:
      network-effects:      {score: 0.35, confidence: 0.90}
      switching-costs:      {score: 0.30, confidence: 0.85}
      data-scale-advantage: {score: 0.10, confidence: 0.8}
      brand-reputation:     {score: 0.45, confidence: 0.85}
