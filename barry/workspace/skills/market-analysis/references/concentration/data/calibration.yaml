      scale-economies:      {score: 0.55, confidence: 0.90}
      regulatory-barriers:  {score: 0.50, confidence: 0.90}
    quality: verified
    sources:
      - "US DOT BTS TranStats archived 2024-02-15, domestic traffic share for Dec 2022-Nov 2023, measured by revenue passenger miles: https://web.archive.org/web/20240215140922/https://www.transtats.bts.gov/"
      - "US GAO, Commercial Aviation: Legacy Airlines Must Further Reduce Costs to Restore Profitability, GAO-04-836, 2004 (aircraft/labour fixed costs, networks, LCC entry and cost structure): https://www.gao.gov/products/gao-04-836"
      - "US GAO, Airline Deregulation, GAO-05-945, 2005 (open economic entry after deregulation and remaining safety oversight): https://www.gao.gov/products/gao-05-945"
