      - "Jon Peddie Research Q4 2023 add-in-board market report, via WCCFTech: Nvidia ~80%, AMD ~19%, Intel ~1% of desktop discrete-GPU unit shipments: https://wccftech.com/amd-nvidia-intel-aib-discrete-gpu-market-share-report-q4-2023/"
      - "NVIDIA 2024 Form 10-K (CUDA/software ecosystem, developer adoption, foundry and capacity commitments, R&D and brand): https://www.sec.gov/Archives/edgar/data/1045810/000104581024000029/nvda-20240128.htm"
      - "TSMC 2023 Annual Report (advanced-node capital expenditure and scale/learning economics): https://investor.tsmc.com/english/annual-reports"
    notes: >
      CUDA, drivers, libraries and developer tooling form an indirect software ecosystem and create
      moderate workflow/code switching costs; gaming brand and driver reliability tilt purchase.
      More shipped GPUs do not themselves improve GPU quality, holding data advantage near zero.
      Fabless vendors avoid owning fabs, but leading-edge design, masks, R&D and capacity commitments
      remain a high ticket; semiconductor fixed costs and learning yield strong scale economies. IP
      matters but does not constitute an exclusive legal franchise. Shares verified/cited; traits
      checked against mechanism evidence without using realized shares.

  - id: us-carbonated-soft-drinks
    name: US carbonated soft drinks
    region: US
    share-basis: revenue
    matured-year: 2022
    categories: [consumer-staples, brand-driven, distribution-scale, oligopoly]
    traits:
      network-effects:      {score: 0.05, confidence: 0.95}
      switching-costs:      {score: 0.05, confidence: 0.95}
      data-scale-advantage: {score: 0.05, confidence: 0.90}
      brand-reputation:     {score: 0.90, confidence: 0.95}
      capital-intensity:    {score: 0.50, confidence: 0.85}
      scale-economies:      {score: 0.75, confidence: 0.90}
      regulatory-barriers:  {score: 0.10, confidence: 0.90}
    quality: verified
    sources:
      - "Beverage Digest 2022 US carbonated-soft-drink company dollar shares, as reported by Statista (Coca-Cola 44.9%, PepsiCo 27.3%, Keurig Dr Pepper 21.0%, Refresco 2.6%, National Beverage 0.5%): https://www.statista.com/statistics/225504/leading-carbonated-soft-drink-companies-in-the-us/"
      - "The Coca-Cola Company 2023 Form 10-K (trademarks, advertising, concentrate/bottling system, distribution and competition): https://www.sec.gov/Archives/edgar/data/21344/000002134424000009/ko-20231231.htm"
      - "FTC, Coca-Cola/Dr Pepper bottling case, 1986 (brand differentiation, advertising and bottling/distribution economics): https://www.ftc.gov/legal-library/browse/cases-proceedings/commission-decision-volumes/volume-110"
    notes: >
      Consumer taste, habit, trademarks and sustained advertising create an unusually strong free-choice
      preference moat. A drink does not improve with other drinkers or usage data, and consumers switch
      at negligible cost. Bottling capacity is meaningful but broadly financeable; national advertising,
      concentrate production, procurement and route distribution provide strong scale economies. Food
      rules and trademarks protect names rather than cap beverage entry. Shares verified/cited; traits
      checked against durable mechanism evidence without using realized shares. The flat top is poorly
      geometric.

  - id: credit-rating-agencies
    name: US / global credit rating agencies
    region: Global
    share-basis: outstanding-ratings
    matured-year: 2022
    categories: [financial-services, regulatory-barriers, reputation, oligopoly]
    traits:
      network-effects:      {score: 0.55, confidence: 0.85}
      switching-costs:      {score: 0.45, confidence: 0.80}
      data-scale-advantage: {score: 0.25, confidence: 0.70}
      brand-reputation:     {score: 0.90, confidence: 0.95}
      capital-intensity:    {score: 0.15, confidence: 0.90}
      scale-economies:      {score: 0.65, confidence: 0.85}
      regulatory-barriers:  {score: 0.80, confidence: 0.95}
    quality: verified
    sources:
      - "SEC Office of Credit Ratings, Staff Report on NRSROs, February 2024 (share of total outstanding credit ratings across all categories, 2023 certifications reflecting year-end 2022 data: S&P 49.96%, Moody's 31.73%, Fitch 12.46%): https://www.sec.gov/files/feb-2024-ocr-staff-report.pdf"
      - "US DOJ, Competition and Monopoly: Single-Firm Conduct Under Section 2, ch. 3 (credit-rating reputation and regulatory reliance as entry barriers; SEC staff findings): https://www.justice.gov/archives/atr/competition-and-monopoly-single-firm-conduct-under-section-2-sherman-act-chapter-3"
      - "SEC, NRSRO registration and oversight (application, recordkeeping, governance and annual certification requirements): https://www.sec.gov/about/divisions-offices/office-credit-ratings"
    notes: >
      Investors and mandates value a rating partly because it is recognised and trusted, creating a
      bounded issuer/investor coordination effect and a very strong reputation gate. Issuers face
      process friction when changing agencies, but commonly use several. Historical default data aids
      models, yet methodology and public credit data make the loop replicable enough to hold the score
      low. Analyst platforms have moderate fixed-cost scale and little physical capital. NRSRO
      registration, oversight and regulatory use are a high legal/compliance barrier. Shares verified/
      cited; traits checked against durable mechanism evidence without using realized shares.

