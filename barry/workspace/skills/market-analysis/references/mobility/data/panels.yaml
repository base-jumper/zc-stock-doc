      IDC is the sole tracker. Early tables include x86 servers while modern traditional-PC tables
      exclude them; the panel is therefore a sampled seed rather than a stable annual series.
    quality: seed-approximate
    penetration:
      logistic: {t0: 2000.0, k: 0.22}
      provenance: estimated
    players:
      Compaq: {founded: 1982, fate: acquired, fate-year: 2002, acquirer: "HP Inc."}
      IBM: {founded: 1911, fate: acquired, fate-year: 2005, acquirer: Lenovo, notes: "IBM's personal-computing division was acquired by Lenovo."}
      "Packard Bell NEC": {founded: 1986, fate: acquired, fate-year: 2008, acquirer: "Acer Group"}
      Apple: {founded: 1976}
      "HP Inc.": {founded: 1939, notes: "Canonical current name for older Hewlett-Packard labels."}
      "Dell Technologies": {founded: 1984, notes: "Canonical current name for older Dell labels."}
      "Acer Group": {founded: 1976}
      Lenovo: {founded: 1984}
      Toshiba: {founded: 1875, fate: acquired, fate-year: 2018, acquirer: Sharp}
      ASUS: {founded: 1989}
    sources:
      - "1996 ordering: https://www.deseret.com/1997/1/28/19291991/compaq-retains-spot-as-top-seller-of-pcs/"
      - "1996 IDC shares: https://www.computerwoche.de/article/2791836/idc-bescheinigt-dem-pc-markt-fuer-1996-ein-16prozentiges-wachstum.html"
