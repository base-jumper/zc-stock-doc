# Concentration calibration corpus. Each entry is one labelled training example: the structural
# trait scores a market exhibits (the input) paired with the rank-share distribution it has
# developed at MATURITY (the outcome, always in shares/<id>.csv). Together these examples define
# and, later, calibrate the trait -> (s1, r) mapping. Realized parameters are always derived fresh
# by concentration_fit.py from the shares CSV, never cached here. See ../concentration.md for the
# model, production trait specification, scoring discipline, and contract for adding entries.
#
# Fields per entry:
#   id            matches shares/<id>.csv
#   name          human label
#   region        geography of the share basis
#   share-basis   revenue | subscribers | units | queries — what the shares measure
#   matured-year  year the realized shares were observed (the outcome as-of)
#   categories    tags for nearest-neighbour selection
#   traits        {score, confidence} per trait id, scored from mechanism (see ../concentration.md)
#   outcome-quality
#                 observed-ranked-shares | synthetic-geometric-shares
#   derived-from  source aggregate-moment file and row id for synthetic shares
#   quality       seed-approximate | verified
#   sources       where the shares / trait evidence come from
#
# Trait ids are defined in traits/. Production direct ridge uses network-effects, scale-economies
# and switching-costs to predict s1 and r independently. All seven remain scored so candidate
# specifications can be reevaluated as the corpus grows.

calibration:
  - id: us-web-search
    name: US web search
    region: US
    share-basis: queries
    matured-year: 2023
    categories: [consumer-internet, data-moat, winner-take-all]
    traits:
      network-effects:      {score: 0.35, confidence: 0.85}
      switching-costs:      {score: 0.10, confidence: 0.9}
      data-scale-advantage: {score: 0.55, confidence: 0.75}
      brand-reputation:     {score: 0.70, confidence: 0.85}
      capital-intensity:    {score: 0.50, confidence: 0.85}
      scale-economies:      {score: 0.80, confidence: 0.90}
      regulatory-barriers:  {score: 0.10, confidence: 0.90}
    quality: verified
    sources:
      - "StatCounter Global Stats, US search-engine share, all devices, monthly Jan-Dec 2023; annual means calculated from the downloadable CSV: https://gs.statcounter.com/search-engine-market-share/all/united-states-of-america/2023"
      - "Google Form S-1, filed 2004-08-04 (search mechanism: link-graph relevance, large index, traffic/brand, low user friction, server infrastructure, competition and uncertain patent protection): https://www.sec.gov/Archives/edgar/data/1288776/000119312504131481/ds1.htm"
      - "Google, 'How Search works' (automated crawling/indexing and ranking systems use aggregate and anonymized interaction data to assess relevance): https://www.google.com/search/howsearchworks/how-search-works/ranking-results/"
    notes: >
      Search is free and another engine is one URL away, so switching cost is negligible. Crawling,
      indexing and interaction signals provide a real scale-quality loop, but diminishing returns and
      replicable web data hold it below strong-moat territory. Advertiser/user feedback is indirect
      and multi-homing is easy, so network effects are bounded. Brand directs habitual queries.
      Distributed indexing requires meaningful infrastructure and has strong fixed-cost economies;
      entry is legally open and patent protection is not a hard gate. Shares verified/cited; traits
      checked against mechanism evidence without using realized shares.

  - id: us-cloud-infrastructure
    name: US / global cloud infrastructure (IaaS+PaaS)
    region: Global
    share-basis: revenue
    matured-year: 2023
    categories: [enterprise-infra, capital-intensive, scale-economies, oligopoly]
    traits:
      network-effects:      {score: 0.30, confidence: 0.80}
      switching-costs:      {score: 0.75, confidence: 0.90}
      data-scale-advantage: {score: 0.15, confidence: 0.8}
      brand-reputation:     {score: 0.50, confidence: 0.80}
      capital-intensity:    {score: 0.90, confidence: 0.95}
      scale-economies:      {score: 0.85, confidence: 0.90}
      regulatory-barriers:  {score: 0.25, confidence: 0.85}
    quality: verified
    sources:
      - "Synergy Research Group, 2024-02-01, Q4 2023 global cloud-infrastructure revenue shares (AWS 31%, Microsoft 24%, Google 11%): https://www.srgresearch.com/articles/cloud-market-gets-its-mojo-back-q4-increase-in-cloud-spending-reaches-new-highs"
      - "Armbrust et al., Above the Clouds, UC Berkeley, 2009 (data-centre purchasing/utilisation economies and data-transfer lock-in risks): https://www2.eecs.berkeley.edu/Pubs/TechRpts/2009/EECS-2009-28.pdf"
      - "Ofcom, Cloud services market study final report, 2023 (egress fees, committed-spend discounts, interoperability and technical barriers to switching/multi-cloud): https://www.ofcom.org.uk/siteassets/resources/documents/consultations/category-1-10-weeks/244808-cloud-services-market-study/associated-documents/final-report-cloud-services-market-study.pdf"
      - "Amazon 2023 Form 10-K (technology infrastructure investment and AWS security, availability and breadth): https://www.sec.gov/Archives/edgar/data/1018724/000101872424000008/amzn-20231231.htm"
    notes: >
      Hyperscale data centres require very large recurring capital and yield purchasing, utilisation,
      power and fixed-cost economies. Data gravity, egress fees, committed spend, proprietary services
      and re-platforming risk create substantial lock-in. Developer ecosystems create a bounded
      indirect effect, but multi-cloud is possible; no evidence supports a material usage-data quality
      flywheel. Enterprise trust tilts procurement. Compliance raises cost but does not cap entry.
      Shares verified/cited; traits checked against mechanism evidence without using realized shares.

  - id: us-ridesharing
    name: US ridesharing
    region: US
    share-basis: revenue
    matured-year: 2023
    categories: [marketplace, network-effects, low-capital, duopoly]
    traits:
      network-effects:      {score: 0.50, confidence: 0.90}
      switching-costs:      {score: 0.10, confidence: 0.90}
      data-scale-advantage: {score: 0.20, confidence: 0.65}
      brand-reputation:     {score: 0.40, confidence: 0.75}
      capital-intensity:    {score: 0.15, confidence: 0.90}
      scale-economies:      {score: 0.45, confidence: 0.80}
      regulatory-barriers:  {score: 0.50, confidence: 0.90}
    quality: verified
    sources:
      - "Bloomberg Second Measure, US observed rideshare consumer spending (2023 chart; 74% Uber / 26% Lyft at year-end): https://secondmeasure.com/datapoints/rideshare-industry-overview/"
      - "California Public Utilities Commission Decision 13-09-045, 2013-09-19 (TNC permit, insurance, driver-check and safety requirements): https://docs.cpuc.ca.gov/PublishedDocs/Published/G000/M077/K132/77132276.PDF"
      - "Uber Form S-1, 2019 (local liquidity network, driver and rider multi-homing, low switching costs, asset-light driver supply, and platform data): https://www.sec.gov/Archives/edgar/data/1543151/000119312519103850/d647752ds1.htm"
    notes: >
      Driver/rider liquidity is a real but city-local network effect weakened by easy multi-homing on
      both sides. Riders retain no costly workflow or data, so switching is nearly frictionless.
      Dispatch data can improve matching, but independent evidence does not show a hard-to-replicate,
      non-plateauing quality loop, holding data advantage low. Drivers supply vehicles, making entry
      capital light; central software and density give moderate scale. Safety reputation matters.
      Permits, insurance and checks are meaningful regulatory hurdles but do not cap licences. Shares
      verified/cited; traits checked against mechanism evidence without using realized shares.

