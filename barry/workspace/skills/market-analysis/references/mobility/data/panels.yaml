      "Home Savings of America, FSB": {founded: 1889}
      "Citibank, National Association": {founded: 1812}
      "The Chase Manhattan Bank": {founded: 1799, fate: acquired, fate-year: 1996, acquirer: "JPMorgan Chase Bank, National Association", notes: "Separate legacy CERT 624 institution acquired by Chemical Bank."}
      "Great Western Bank": {founded: 1935}
      "NationsBank, National Association": {founded: 1874}
      "NationsBank of Texas, National Association": {founded: 1874}
      "NationsBank, National Association (South)": {founded: 1874}
      "Wachovia Bank, National Association": {founded: 1879, notes: "Canonical name for the First Union lineage after its Wachovia transaction."}
      "First Union National Bank of Florida": {founded: 1908}
      "PNC Bank, National Association": {founded: 1852}
      "Fleet National Bank (CERT 2499)": {founded: 1791}
      "Fleet National Bank (CERT 2558)": {founded: 1791, notes: "Canonical Fleet lineage; the inherited charter was briefly reported as BankBoston."}
      "KeyBank, National Association": {founded: 1825}
      "U.S. Bank National Association": {founded: 1863, notes: "Canonical name for the Firstar lineage after the U.S. Bancorp transaction."}
      "U.S. Bank National Association (CERT 5134)": {founded: 1863}
      "Washington Mutual Bank": {founded: 1889}
      "SunTrust Bank": {founded: 1891}
      "Bank One, National Association": {founded: 1873}
      "HSBC Bank USA, National Association": {founded: 1865}
      "World Savings Bank, FSB": {founded: 1912}
      "National City Bank": {founded: 1845}
      "Regions Bank": {founded: 1971}
      "Truist Bank": {founded: 2019, notes: "Canonical lineage for CERT 9846, reported historically as Branch Banking and Trust Company before the BB&T-SunTrust merger."}
      "TD Bank, National Association": {founded: 1852}
      "Capital One, National Association": {founded: 1994}
      "Charles Schwab Bank": {founded: 2003}
      "Goldman Sachs Bank USA": {founded: 2008}
      "The Bank of New York Mellon": {founded: 1784}
      "First Fidelity Bank, National Association": {founded: 1994, fate: acquired, fate-year: 1996, acquirer: "Wachovia Bank, National Association"}
      "Barnett Bank, National Association": {founded: 1877, fate: acquired, fate-year: 1998, acquirer: "NationsBank, National Association"}
    sources:
      - "FDIC Bank Data API documentation: https://api.fdic.gov/banks/docs"
      - "FDIC Financials endpoint: https://api.fdic.gov/banks/financials"
    notes: >
      The CSV covers each December 31 from 1994 through 2025. Shares are calculated from DEPDOM
      numerator and denominator values returned by the same Financials query and rounded to six
      decimals only after ranking. The broader Financials universe is intentionally used instead
      of a 50-states-plus-DC Summary-table denominator.

