# Rank-mobility panel corpus index. Each entry describes one named ranking panel stored in
# panels/<id>.csv (rows: year,rank,player,share). See ../calibration.md for the corpus contract,
# fate vocabulary, acquisition rule, and collection discipline.
#
# Fields per entry:
#   id             matches panels/<id>.csv
#   name           human label
#   market         market boundary + what a share measures
#   region         geography of the ranking
#   basis          units | revenue | subscribers | passengers | deposits | premiums | ...
#   coverage       number of ranks the source names each year
#   tracker        tracker/publication the ranking tables come from (the series provenance the
#                  no-splicing rule applies to; per-year citations go in sources)
#   tracker-notes  optional: definition changes, methodology breaks
#   quality        seed-approximate | verified (verified = every covered year cited)
#   penetration    optional: normalized adoption-curve position (L = 1), analyst-scored —
#                    logistic: {t0: inflection year, k: steepness per year}
#                    provenance: fitted | estimated (pinned by adoption data vs judgment)
#                  F(t) = 1/(1+exp(-k(t-t0))); see ../calibration.md
#   players        canonical name -> {founded, entered-market?, fate?, fate-year?, acquirer?, notes?}
#   sources        one citation per covered year (or per multi-year table)
#   notes          free-form

panels:
  - id: worldwide-smartphone-units
    name: Worldwide smartphone unit shipments
    market: >
      Worldwide smartphone shipments to channel, all vendors; a share is a vendor's full-year
      shipments as a fraction of total worldwide shipments.
    region: Global
    basis: units
    coverage: 5
    tracker: "IDC Worldwide Quarterly Mobile Phone Tracker, full-year top-5 vendor tables (press releases)"
    quality: verified
    penetration:
      logistic: {t0: 2012.3, k: 0.308}
      provenance: fitted
    players:
      Samsung:   {founded: 1969}
      Apple:     {founded: 1976}
      Huawei:    {founded: 1987, fate: fringe, fate-year: 2021, notes: "US sanctions cut smartphone volumes from 2020; still competing"}
      LG:        {founded: 1958, fate: exited, fate-year: 2021, notes: "closed its smartphone business July 2021"}
      Lenovo:    {founded: 1984, fate: fringe, fate-year: 2016, notes: "still competing via the Motorola brand"}
      Xiaomi:    {founded: 2010}
      OPPO:      {founded: 2004, entered-market: 2011, notes: "first listed smartphone model was Oppo Find Me"}
      vivo:      {founded: 2009}
      Transsion: {founded: 2006, entered-market: 2014, notes: "smartphones under Tecno/Infinix/itel brands"}
    sources:
      - "2013 ranking: https://web.archive.org/web/20140131071943id_/http://www.idc.com/getdoc.jsp?containerId=prUS24645514"
      - "2016 ranking and Lenovo's first year below the top five: https://web.archive.org/web/20170201184608id_/http://www.idc.com/getdoc.jsp?containerId=prUS42268917"
      - "2021 ranking and Huawei's first year below the top five: https://web.archive.org/web/20220127235658id_/https://www.idc.com/getdoc.jsp?containerId=prUS48830822"
      - "2023 ranking: https://web.archive.org/web/20240116060626id_/https://www.idc.com/getdoc.jsp?containerId=prUS51776424"
      - "LG mobile exit: https://web.archive.org/web/20210405015916id_/https://www.lgnewsroom.com/2021/04/lg-to-close-mobile-phone-business-worldwide/"
      - "Samsung founded: https://en.wikipedia.org/wiki/Samsung_Electronics"
      - "Apple founded: https://en.wikipedia.org/wiki/Apple_Inc."
      - "Huawei founded: https://en.wikipedia.org/wiki/Huawei"
      - "LG founded: https://en.wikipedia.org/wiki/LG_Electronics"
      - "Lenovo founded: https://en.wikipedia.org/wiki/Lenovo"
      - "Xiaomi founded: https://en.wikipedia.org/wiki/Xiaomi"
      - "OPPO founded: https://en.wikipedia.org/wiki/Oppo"
      - "OPPO smartphone entry: https://en.wikipedia.org/wiki/Oppo_phones"
      - "vivo founded: https://en.wikipedia.org/wiki/Vivo_(technology_company)"
      - "Transsion founded and smartphone entry: https://en.wikipedia.org/wiki/Transsion"
    notes: >
      IDC's tables label all four years preliminary and define shipments as branded new-device
      shipments excluding OEM and refurbished units. The panel deliberately exercises entrants
      (Xiaomi, Transsion), an exit (LG), and falls to fringe (Huawei, Lenovo). Company-history
      citations are secondary sources; ranking citations and LG's exit citation are primary.

