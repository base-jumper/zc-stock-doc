      - "2025 table: https://www.idc.com/resource-center/press-releases/4q25-pc-top-5-pr/"
      - "Company histories: https://www.acer.com/corporate/en/overview/milestones, https://www.lenovo.com/us/en/about/who-we-are/history/"
    notes: >
      Covered years are 1996, 2006-2007, 2014-2016, 2019-2022, and 2025. The 1996 HP share is the
      exact residual between IDC's published 65.0% Other category and the other four named vendor
